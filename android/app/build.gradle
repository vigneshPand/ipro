apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * React Native configuration
 */
react {
    autolinkLibrariesWithApp()
}

// ─── Load keystore credentials from gitignored keystore.properties ─────────────
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

/**
 * Enable Proguard (keep false for now)
 */
def enableProguardInReleaseBuilds = false

/**
 * JavaScriptCore flavor
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.ipromobile"

    defaultConfig {
        applicationId "com.ipromobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 4
        versionName "1.0.0"

        // Azure AppAuth redirect scheme
        manifestPlaceholders = [
            appAuthRedirectScheme: "msauth"
        ]
    }

    /**
     * Signing configurations
     */
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }

        release {
            // Load from keystore.properties first; fall back to project/env properties for CI
            def storeFileVal = keystoreProperties['IPRO_STORE_FILE'] ?: (project.hasProperty('IPRO_STORE_FILE') ? IPRO_STORE_FILE : 'ipro-release.keystore')
            def storePwVal   = keystoreProperties['IPRO_STORE_PASSWORD'] ?: (project.hasProperty('IPRO_STORE_PASSWORD') ? IPRO_STORE_PASSWORD : '')
            def keyAliasVal  = keystoreProperties['IPRO_KEY_ALIAS']     ?: (project.hasProperty('IPRO_KEY_ALIAS')     ? IPRO_KEY_ALIAS     : '')
            def keyPwVal     = keystoreProperties['IPRO_KEY_PASSWORD']  ?: (project.hasProperty('IPRO_KEY_PASSWORD')  ? IPRO_KEY_PASSWORD  : '')
            storeFile     file(storeFileVal)
            storePassword storePwVal
            keyAlias      keyAliasVal
            keyPassword   keyPwVal
        }
    }

    /**
     * Build types
     */
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources false
            proguardFiles getDefaultProguardFile(
                    "proguard-android-optimize.txt"
            ), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Vector icons
apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"
